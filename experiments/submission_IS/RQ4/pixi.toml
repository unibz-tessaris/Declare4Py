[workspace]
authors = ["Sergio Tessaris <tessaris@inf.unibz.it>"]
channels = ["conda-forge"]
name = "IS submission RQ4"
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-64", "win-64"]
version = "0.1.0"

[tasks.experiment]
description = "Runs the experiments from `asp_generator.py` notebook and writes the results in the results/ folder, using the given suffix (first argument, default to `2025-IS`) to distinguish different runs."
args = [
    {arg = "suffix", default = "2025-IS"},
    {arg = "notebook", default = "asp_generator.py"},
]
depends-on = [
    {task="_mo_export", args=[
        {"notebook" = "{{notebook}}"},
        {"output" = "results/{{notebook | replace('.py','_' + suffix)}}.html"},
        {"notebook_args" = "--result_dir \"results/{{notebook | replace('.py','_' + suffix)}}\""}
    ]}
]
cmd = "echo 'Experiment output exported to results/{{notebook | replace('.py','_' + suffix)}}'"

[tasks.test_experiment]
description = "Runs a smaller version of the experiments from `asp_generator_test.py` notebook and writes the results in the results/ folder, using the given suffix (first argument, default to `2025-IS_test`) to distinguish different runs."
depends-on = [
    {task="experiment", args=[
        {"suffix" = "2025-IS_test"},
        {"notebook" = "asp_generator_test.py"},
    ]}
]

[tasks.analysis]
description = "Runs the analysis notebook on the results generated by the experiments, by default uses the results from the `results/asp_generator_2025-12` directory."
args = [
    {arg = "result_dir", default = "results/asp_generator_2025-12"},
    {arg = "notebook", default = "analysis.py"}
]
depends-on = [
    {task="_mo_run", args=[
        {"notebook" = "{{notebook}}"},
        {"notebook_args" = "--result_dir \"{{result_dir}}\""}
    ]}
]

[tasks._mo_edit]
args = [
    {"arg" = "notebook"}
]
cmd = "marimo edit '{{notebook}}'"

[tasks._mo_export]
args = [
    {"arg" = "notebook"},
    {"arg" = "output"},
    {"arg" = "notebook_args", "default" = ""}
]
cmd = "marimo export html --no-include-code '{{notebook}}' -o '{{output}}' -- {{notebook_args}}"

[tasks._mo_run]
args = [
    {"arg" = "notebook"},
    {"arg" = "notebook_args", "default" = ""}
]
cmd = "marimo run '{{notebook}}' -- {{notebook_args}}"


[dependencies]
marimo = ">=0.18.4,<0.19"
polars = ">=1.36.1,<2"
polars-runtime-compat = ">=1.36.1,<2"
python-levenshtein = ">=0.27.3,<0.28"
simple-parsing = ">=0.1.7,<0.2"
altair = ">=6.0.0,<7"
great_tables = ">=0.20.0,<0.21"
pyarrow = ">=22.0.0,<23"
pandas = ">=2.3.3,<3"
nbformat = ">=5.10.4,<6"
vegafusion = ">=2.0.3,<3"
vl-convert-python = ">=1.8.0,<2"

[pypi-dependencies]
logaut = "*"
pm4py = ">=2.5.1"
ltlf2dfa = "==1.0.2"

declare4py = { path = "../../..", editable = true}
rustxes = ">=0.2.11, <0.3"
